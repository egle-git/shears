stages:
  - buildCMSSW
  - build
  - runHzz
  - comparisons
  - harvesting
#before_script:
#  - .gitlab-ci/setup_cmssw.sh

baobabs:
  stage: buildCMSSW
  tags: [ cvmfs ]
  script:
  - wget -nv "https://slack.com/api/chat.postMessage?token=$SLACKTOKEN&channel=slackci&text=Hello%20here%20the%20shears%20CI&pretty=1&username=shearsDocker" >&  scrunch
  - wget -nv "https://slack.com/api/chat.postMessage?token=$SLACKTOKEN&channel=slackci&text=testing%20branch%20$CI_COMMIT_REF_NAME%20for%20$GITLAB_USER_NAME&pretty=1&username=shearsDocker" >& scranch
  - .gitlab-ci/compile-scram.sh Baobabs
  artifacts:
    paths:
    - shearsCompilated.tar.gz
    expire_in: 60 minutes

pruner:
  stage: build
  tags: [ cvmfs ]
  script: .gitlab-ci/compile.sh Bonzais
  artifacts:
    paths:
    - Bonzais/pruner
    expire_in: 60 minutes

hzz2l2nu:
  stage: build
  tags: [ cvmfs ]
  script:
    - yum -q -y install boost-devel
    - .gitlab-ci/compile.sh HZZ2l2nu
  artifacts:
    paths:
    - HZZ2l2nu/runHZZanalysis
    expire_in: 60 minutes

runHzz DiMuData:
  stage: runHzz
  tags: [ cvmfs ]
  allow_failure: true
  script:
    - .gitlab-ci/runHwwCode.sh doubleMuData.root doubleMuHistos.root 0 0
  artifacts:
    paths:
    - HZZ2l2nu/doubleMuHistos.root
    expire_in: 60 minutes

runHzz DiElData:
  stage: runHzz
  tags: [ cvmfs ]
  allow_failure: true
  script:
    - .gitlab-ci/runHwwCode.sh doubleEGData.root doubleElHistos.root 0 0
  artifacts:
    paths:
    - HZZ2l2nu/doubleElHistos.root
    expire_in: 60 minutes

runHzz DYMC:
  stage: runHzz
  tags: [ cvmfs ]
  allow_failure: true
  script:
    - .gitlab-ci/runHwwCode.sh Bonzai-DYJetsToLL.root DYHistos.root 1 0
  artifacts:
    paths:
    - HZZ2l2nu/DYHistos.root
    expire_in: 60 minutes

runHzz PhotonData:
  stage: runHzz
  tags: [ cvmfs ]
  allow_failure: true
  script:
    - .gitlab-ci/runHwwCode.sh SinglePhotonDataGH.root SinglePhotonsHistos.root 0 1
  artifacts:
    paths:
    - HZZ2l2nu/SinglePhotonsHistos.root
    expire_in: 60 minutes

runHzz GammaJetMC:
  stage: runHzz
  tags: [ cvmfs ]
  allow_failure: true
  script:
    - .gitlab-ci/runHwwCode.sh Bonzai-GJets_HT-200To400.root gammaJetHisto.root 1 1
  artifacts:
    paths:
    - HZZ2l2nu/gammaJetHisto.root
    expire_in: 60 minutes

compHzz DiMu:
  stage: comparisons
  tags: [ cvmfs ]
  allow_failure: true
  script:
    - yum -q -y install glibc-headers glibc-devel git gsl-devel freetype-devel libSM libX11-devel libXext-devel make gcc-c++ gcc binutils libXpm-devel libXft-devel boost-devel
    - .gitlab-ci/runComparisons.sh doubleMuHistos
  dependencies:
    - runHzz DiMuData
  artifacts:
    paths:
    - HZZ2l2nu/result_doubleMuHistos
    expire_in: 60 minutes

compHzz DiEle:
  stage: comparisons
  tags: [ cvmfs ]
  allow_failure: true
  script:
    - yum -q -y install glibc-headers glibc-devel git gsl-devel freetype-devel libSM libX11-devel libXext-devel make gcc-c++ gcc binutils libXpm-devel libXft-devel boost-devel
    - .gitlab-ci/runComparisons.sh doubleElHistos
  dependencies:
    - runHzz DiElData
  artifacts:
    paths:
    - HZZ2l2nu/result_doubleElHistos
    expire_in: 60 minutes

compHzz DYMC:
  stage: comparisons
  tags: [ cvmfs ]
  allow_failure: true
  script:
    - yum -q -y install glibc-headers glibc-devel git gsl-devel freetype-devel libSM libX11-devel libXext-devel make gcc-c++ gcc binutils libXpm-devel libXft-devel boost-devel
    - .gitlab-ci/runComparisons.sh DYHistos
  dependencies:
    - runHzz DYMC
  artifacts:
    paths:
    - HZZ2l2nu/result_DYHistos
    expire_in: 60 minutes

compHzz SinglePhoton:
  stage: comparisons
  tags: [ cvmfs ]
  allow_failure: true
  script:
    - yum -q -y install glibc-headers glibc-devel git gsl-devel freetype-devel libSM libX11-devel libXext-devel make gcc-c++ gcc binutils libXpm-devel libXft-devel boost-devel
    - .gitlab-ci/runComparisons.sh SinglePhotonsHistos
  dependencies:
    - runHzz PhotonData
  artifacts:
    paths:
    - HZZ2l2nu/result_SinglePhotonsHistos
    expire_in: 60 minutes

compHzz GammaJetMC:
  stage: comparisons
  tags: [ cvmfs ]
  allow_failure: true
  script:
    - yum -q -y install glibc-headers glibc-devel git gsl-devel freetype-devel libSM libX11-devel libXext-devel make gcc-c++ gcc binutils libXpm-devel libXft-devel boost-devel
    - .gitlab-ci/runComparisons.sh gammaJetHisto
  dependencies:
    - runHzz GammaJetMC
  artifacts:
    paths:
    - HZZ2l2nu/result_gammaJetHisto
    expire_in: 60 minutes

getCompResults:
  stage: harvesting
  tags: [ cvmfs ]
  allow_failure: true
  dependencies:
    - compHzz DiMu
    - compHzz DiEle
    - compHzz DYMC
    - compHzz SinglePhoton
    - compHzz GammaJetMC
  script:
  - wget -nv  "https://slack.com/api/chat.postMessage?token=$SLACKTOKEN&channel=slackci&text=tests%20results%20for%20$CI_COMMIT_REF_NAME&pretty=1&username=shearsDocker" >&  scrantch
  - .gitlab-ci/harvest.sh $SLACKTOKEN
  artifacts:
    paths:
    - HZZ2l2nu/allComparisons.tar.gz
