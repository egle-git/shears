# This is the configuration file for the DY analysis, year 2016.
# Please keep it organized, and don't delete comments.

# Options related to output and logs
log:
    # Whether to use colors in the terminal.
    #Possible values: yes|no|auto (default: auto)
    color: auto

    # Controls what's printed to the screen.
    # Possible values: debug|info|warn|error|fatal (default: info)
    log level: info

    # Pipe logs to the given log file, comment out for no log.
    log file: log16.txt

    # Controls what's written in the log file.
    # Possible values: debug|info|warn|error|fatal (default: debug)
    log file level: debug

    # Whether to override ROOT's default log handler.
    # Default value: yes
    #override root handler: yes


# when you want to separate a specific flavor from DY->ll events (e.g. Madgraph)
# it will check the dilepton flavor at the generator level, and skip the events if the flavor is not same with the given flavor
# WARNING: It should be used for *DY MC only*. Background MC with this option will give meaningless results.
# default: false
Select specific flavor in DYLL:
  use: false
  flavor: -1 # pdgID. DY->ee: 11 / DY->mm: 13 / DY->tautau: 15

# Cut on the inclusive DYJets sample
use exclusive mass binned DYJets samples: yes

# dilepton pt reweighting option
# the reweighting factor is derived from (data-bkg) vs. DY MC comparison of dilepton pT @ reco-level
# WARNING: it should be applied to *DY MC only* (i.e not use for backgrounds)
# default: false
dilepton pt reweighting:
  use: false
  reweighting factor path: "." # -- under EfficiencyTables/ (e.g. 2016preAPV/ROOTFile_DimuonPt_Weight_Madgraph.root)

# Whether to use pileup reweighing
# Default value: true
use pileup reweighing: true

# specify the type for the pileup
# options:
# - 2016_PreAPV, 2016_PostAPV
# - 2016_PreAPV_emu, 2016_PostAPV_emu (for the data collected with the emu trigger)
# - 2017
# - 2018
pileup type: 2016_PreAPV

# Whether results are preliminary (for plots)
preliminary: yes

# definition of the phase space to be unfolded
generator level:
  # minimum pt on gen leptons [GeV]
  # default: 20 GeV
  lepton pt: 15

  # minimum pt on gen leptons [GeV]
  # default: 25 GeV
  leading lepton pt: 20

  # maximum lepton |eta| cut
  # default: 2.4
  lepton eta: 2.4

# Options related to the selection of jets
jets:
    # Pt cut [GeV]
    # Default value: 30
    pt: 50

    # Eta cut
    # Default value: 2.5
    eta: 2.5

    # PU MVA cut
    # Default value: -0.2
    #pu mva: -0.2

    # PU id
    # Default value: tight
    #pu id: tight

    # deltaR(jet, lepton) cut
    # Default value: 0.4
    lepton delta r: 0.4

    # Whether to apply jet energy smearing
    # Default value: yes
    JER smearing: yes
    Jet pt resolution: Summer20UL16APV_JRV3_MC_PtResolution_AK4PFchs.txt
    Jet MC SF: Summer20UL16APV_JRV3_MC_SF_AK4PFchs.txt

prefiring weights:
    # Whether to apply prefiring weights
    use: yes
    # syst. variation mode
    # 0 = nominal / 1 = up variation / -1 = down variation
    mode: 0

# Options of the b jet veto
b jet veto:
    # Whether to cut events with b jets
    # Default value: yes
    use: yes

    # Working point; see the b tagging POG TWiki for recommended working points
    # Allowed values: loose, medium, tight
    # Default value: loose
    working point: medium

    # Location of the scale factors csv file. Interpreted relative to the
    # EfficiencyTables/ directory.
    scale factor path: 2016preAPV/wp_deepJet_2016preAPV.csv

# Options related to the selection of electrons
electrons:
    # Pt cut [GeV]
    # Default value: 20
    pt: 20

    # Eta cut
    # Default value: 2.4
    eta: 2.4

    # Relative isolation cut
    # Default value: 0.25
    isolation: 999999999.

    # Id
    # Possible values: loose, medium, tight
    # Default value: tight
    id: medium

    # Whether to use the identification scale factors
    # Default value: yes
    use id scale factors: no

    # Whether to use the reconstruction scale factors
    # Default value: yes
    use reconstruction scale factors: no

# Options related to the selection of muons
muons:
    # Pt cut [GeV]
    # Default value: 20
    pt: 15

    # Eta cut
    # Default value: 2.4
    eta: 2.4

    # Relative isolation cut
    # Default value: 0.25
    #isolation: 0.15

    #Iso
    # Possible values: veryloose, loose, medium, tight
    iso: tight

    # Id
    # Possible values: loose, medium, tight
    # Default value: tight
    id: tight

    # Whether to use the identification scale factors
    # Default value: yes
    use id scale factors: yes

    # Whether to use the isolation scale factors
    # Default value: yes
    use isolation scale factors: yes

    # Whether to use the tracking scale factors
    # Default value: yes
    use tracking scale factors: no

    # Whether to use Rochester correction
    # Default value: yes
    use rochester correction: yes

    # Path to the directory containing tables for Rochester corrections. Interpreted relative to
    # the EfficiencyTables/ directory.
    # Default value: rcdata.2016.v3
    rochester correction path: 2016preAPV/RoccoR2016aUL.txt
    #rochester correction path: rcdata.2016.v3

# Good Z boson settings
Z:
    # leading "lepton" pT cut [GeV]
    # Default value: 25
    leading lepton pt: 20

    # m(ll)/pt(lep, sub) < X cut: reduce QCD in high mass region
    mll/subleading lepton pt: 10

    # Low mass bound [GeV]
    # Default value: 0
    low mass: 40

    # High mass bound [GeV]
    # Default value: infinity
    high mass: 3000

    # Charge check mode
    # Possible values:
    #   - none: No check
    #   - neutral: Keep only lepton pairs of opposite sign
    #   - same sign: Keep only lepton pairs of the same sign
    # Default value: neutral
    charge mode: neutral

    # Flavor check mode
    # Possible values:
    #   - none: No check
    #   - same: Two leptons of the same flavor
    #   - ee: Two electrons
    #   - mumu: Two muons
    #   - emu: One electron and one muon
    # Default value: same
    flavor mode: mumu

# How the measurement is binned in mass
# Default value: empty
mass bins: [ 40, 50, 76, 106, 170, 350, 1000, 3000 ]

# Triggers
#
# The values below must be strings; use an empty string to disable triggers. See the documentation
# of physics::trigger_mask for more details.
triggers: |
    HLT_Mu17_TrkIsoVVL_Mu8_TrkIsoVVL,
    HLT_Mu17_TrkIsoVVL_TkMu8_TrkIsoVVL,
    HLT_IsoMu24,
    HLT_IsoTkMu24

use trigger scale factors: yes

# select the best trigger SF depending on leading muon pt & fired trigger
# this feature is only needed for the dimuon analysis
select the best muon trigger SF:
  # default: true
  # if it is false, shears will always select single muon trigger SF (can be used for test jobs)
  use: true

  # single muon triggers used
  single muon triggers: |
    HLT_IsoMu24,
    HLT_IsoTkMu24

  # double muon triggers
  double muon triggers: |
    HLT_Mu17_TrkIsoVVL_Mu8_TrkIsoVVL,
    HLT_Mu17_TrkIsoVVL_TkMu8_TrkIsoVVL

  # pt criteria for which trigger is used
  # leading pt < pt criteria: use DMu / leading pt > pt criteria: use SMu
  pt criteria: 26

  # reject the events that fires single muon triggers "only" (i.e not pass dimuon triggers)
  # but with pT(leading) < (pt_criteria) GeV muons (muons in turn-on curve or below)
  # these events are not used due to the large SF
  # reject or not (default: false)
  reject low quality muon events: true

# Reweighting for top backgrounds (emu method)
emu method reweighting:
  use: no
  parameters: [1.30676, -0.160525]
  errors: [0.0748408, 0.0349042]
  fakes plus: [1.19579, -0.119882]
  fakes minus: [1.41748, -0.201049]

# List of available data/MC samples
samples:
