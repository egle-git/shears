# Reweighing (eg for merged samples)
#
# For each possible reweighing, the syntax is:
#
#   sample name: table.txt
#
# The table should contain the numbers needed for reweighing. In order to be
# useful, several samples will often share the same table.
#
# The tables can be derived by tweaking Main/dyjets-sample-weights.cc.
#reweighing:
#    # Based on the number of partons npNLO
#    npNLO:
#        DYJets:     merging-DYJets-npNLO.txt
#        DYJets-0J:  merging-DYJets-npNLO.txt
#        DYJets-1J:  merging-DYJets-npNLO.txt
#        DYJets-2J:  merging-DYJets-npNLO.txt

# How to group MC samples when drawing Data/MC comparisons
MC grouping:
    - legend: "Z/#gamma^{*} #rightarrow #mu#mu"
      required: yes
      #samples: [ DYJets ]
      samples: [ DYJets_M-10to50, DYJets_M-50to100, DYJets_M-100to200, DYJets_M-200to400,
                 DYJets_M-400to500, DYJets_M-500to700, DYJets_M-700to800, DYJets_M-800to1000,
                 DYJets_M-1000to1500, DYJets_M-1500to2000, DYJets_M-2000toInf ]
      color: 408 # kGreen - 8
      is signal: yes
    - legend: "t#bar{t}"
      samples: [ TT ]
      color: 600 # kBlue
    - legend: VV
      samples: [ ZZ, WWTo2L2Nu, WZ ]
      color: 633 # kRed + 1
    - legend: Single top
      samples: [ ST_s-channel, ST_t-channel_antitop, ST_t-channel_top, ST_tW_antitop, ST_tW_top ]
      color: 616 # kMagenta
    - legend: DY TauTau
      samples: [ TauTau ]
      color: 434 # kCyan + 2
    - legend: "#gamma#gamma"
      samples: [ GammaGamma, GammaGamma_M-5to50 ]
      color: 800 # kOrange
    # Uncomment below only for reco histogram drawing when you have the fakes from SS method!
    # - legend: "Fakes"
    #   samples: [ Fakes ]
    #   color: 879 # kViolet - 1

# The file below defines the binnings for histograms relevant to the analysis.
# Default value: dyjets-binnings.yml
binning file: dyjets-binnings.yml

# Plot properties
#
# The sole mandatory field is the "selector", containing a regex that is matched
# against plot names. When a plot name matches the regex, properties listed in
# other fields are assigned to it. In general, rules lower in the list take
# precedence over the ones above them, but for some properties they add up.
#
# Supported properties:
#   - produce (yes): Whether to make the plot
#   - log x (no): Whether to x axis should use a log scale
#   - ratio min (0.601): The minimum value shown on data/mc ratio plots
#   - ratio max (1.399): The maximum value shown on data/mc ratio plots
#   - x axis label: The label of the x axis. Captures from the selector can be
#                   used to provide dynamic labels.
#   - x axis detail: Text that will appear in parenthesis after the axis label.
#                    Several labels can be added this way. Captures from the
#                    selector can be used to provide dynamic labels.
#   - x axis unit: The unit of the x axis. Appears between square brackets after
#                  the main label. Captures from the selector can be used to
#                  provide dynamic labels.
plots:
    # Excluded plots
    - selector: '^_.*'
      produce: no
    - selector: '.*-gen$'
      produce: yes
    - selector: '.*-matrix$'
      produce: no
    - selector: '.*[12]jet.*'
      produce: no
    - selector: 'el.*'
      produce: no
    - selector: 'mu.*'
      produce: yes
    - selector: 'mu.*subleading.*'
      produce: yes
    - selector: 'muIso.*'
      produce: no
    - selector: 'genLep.*'
      produce: no
    - selector: 'bjet.*'
      produce: no
    - selector: 'jet.*leading.*'
      produce: no
    - selector: 'jet.*subleading.*'
      produce: no
    - selector: 'jet.*third.*'
      produce: no
    - selector: 'jet.*fourth.*'
      produce: no
    - selector: '.*exc.*'
      produce: no
    - selector: 'mass.*mass.*'
      produce: no
    - selector: '.*exc.*'
      produce: no
    - selector: 'nJets.*_inc.*'
      produce: no
    - selector: 'nJets.*_inc0jet.*'
      produce: no
    - selector: '.*decay.*'
      produce: no
    - selector: '.*OF.*'
      produce: no
    - selector: '.*UF.*'
      produce: no
    - selector: '.*fineB.*'
      produce: no
    - selector: '.*-matrix.*'
      produce: no
    - selector: '.*L1Pref.*'
      produce: no
    - selector: '.*TUnfold.*'
      produce: no
    - selector: '.*phistar.*'
      produce: no
    - selector: '.*MET.*'
      produce: no
    - selector: '.mll_over_ptsub.*'
      produce: no
    - selector: '.*pileup.*'
      produce: no
    - selector: '^dyjets_events_peak.*'
      produce: no
    - selector: '^rapidity.*'
      produce: no
    # Style changes
    - selector: '.*'
      ratio min: 0.901
      ratio max: 1.099
    - selector: '^phistar.*'
      log x: yes
    - selector: '^pt.*'
      log x: yes
    - selector: '^mass_wide.*'
      log x: yes
    - selector: '^nJets.*'
      ratio min: 0.601
      ratio max: 1.399
    - selector: '^jet.*'
      ratio min: 0.601
      ratio max: 1.399
    # Axis labels
    - selector: '^mass.*'
      x axis label: 'M_{#mu#mu}'
      x axis unit: 'GeV'
    - selector: '^nJets.*'
      x axis label: 'Exclusive number of jets'
    - selector: '^nJetsIncl.*'
      x axis label: 'Inclusive number of jets'
    - selector: '^phistar.*'
      x axis label: '#phi*'
    - selector: '^pt.*'
      x axis label: 'p_{T}^{#mu#mu}'
      x axis unit: 'GeV'
    - selector: '.+mass(.*)_(.*).*'
      x axis detail: '$1 #leq M_{#mu#mu} < $2 GeV'
    - selector: '.*inc(1|2)jet.*'
      x axis detail: 'N_{jets} #geq $1'
    - selector: '.*exc(1|2)jet.*'
      x axis detail: 'N_{jets} = $1'

uncertainties:
  PDF and scale: false
  GenWeightInfo directory: SystTables/GenWeight
  pileup: false
  L1 prefiring: false
  Muon Rochester correction: false
  efficiency SF: false
  efficiency file: /pnfs/iihe/cms/store/user/kplee/Shears/Uncertainty/EffSF/v230730/LeptonEffMap_FullRun2.root
  emu method fit parameter: false
  emu method fake background: false
  same-sign method fit parameter: false
  same-sign method fit function choice: false
  same-sign method ewk bkg reweight: false
  same-sign method electron charge misid: false
