      type: data
      jobs: 16
      nano dir: Catalogs/2016preAPV
      catalog: Catalog2016_bonzai_SingleMuon_data.txt
      triggers: |
          ^HLT_Mu17_TrkIsoVVL_Mu8_TrkIsoVVL,
