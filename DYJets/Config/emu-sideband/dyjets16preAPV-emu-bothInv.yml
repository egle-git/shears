# This is the configuration file for the DY analysis, year 2016.
# Please keep it organized, and don't delete comments.

# Options related to output and logs
log:
    # Whether to use colors in the terminal.
    #Possible values: yes|no|auto (default: auto)
    color: auto

    # Controls what's printed to the screen.
    # Possible values: debug|info|warn|error|fatal (default: info)
    log level: info

    # Pipe logs to the given log file, comment out for no log.
    log file: log16_preAPV_emu.txt

    # Controls what's written in the log file.
    # Possible values: debug|info|warn|error|fatal (default: debug)
    log file level: debug

    # Whether to override ROOT's default log handler.
    # Default value: yes
    #override root handler: yes

os location: EMu_2016preAPV_bothInv
ss location: EMu_2016preAPV_samesign_bothInv

# Cut on the inclusive DYJets sample
use exclusive mass binned DYJets samples: no

# Whether to use pileup reweighing
# Default value: true
use pileup reweighing: true

# specify the type for the pileup
# options:
# - 2016_PreAPV, 2016_PostAPV
# - 2016_PreAPV_emu, 2016_PostAPV_emu (for the data collected with the emu trigger)
# - 2017
# - 2018
pileup type: 2016_PreAPV

# Whether results are preliminary (for plots)
preliminary: yes

# definition of the phase space to be unfolded
generator level:
  # minimum pt on gen leptons [GeV]
  # default: 20 GeV
  lepton pt: 15

  # minimum pt on gen leptons [GeV]
  # default: 25 GeV
  leading lepton pt: 20

  # maximum lepton |eta| cut
  # default: 2.4
  lepton eta: 2.4

# Options related to the selection of jets
jets:
    # Pt cut [GeV]
    # Default value: 30
    pt: 30

    # Rapidity cut
    # Default value: 2.4
    rapidity: 2.4

    # PU MVA cut
    # Default value: -0.2
    pu mva: -0.2

    # deltaR(jet, lepton) cut
    # Default value: 0.4
    lepton delta r: 0.4

    # Whether to apply jet energy smearing
    # Default value: yes
    JER smearing: yes

prefiring weights:
    # Whether to apply prefiring weights
    use: yes
    # syst. variation mode
    # 0 = nominal / 1 = up variation / -1 = down variation
    mode: 0

# Options of the b jet veto
b jet veto:
    # Whether to cut events with b jets
    # Default value: yes
    use: no

    # Working point; see the b tagging POG TWiki for recommended working points
    # Allowed values: loose, medium, tight
    # Default value: loose
    working point: medium

    # Location of the scale factors csv file. Interpreted relative to the
    # EfficiencyTables/ directory.
    # Default value: CSVv2_Moriond17_B_H.csv
    scale factor path: CSVv2_Moriond17_B_H.csv

# Options related to the selection of electrons
electrons:
    # Pt cut [GeV]
    # Default value: 20
    pt: 20

    # Eta cut
    # Default value: 2.4
    eta: 2.5

    # Relative isolation cut
    # Default value: 0.25
    isolation: 999999999.

    # Id
    # Possible values: loose, medium, tight
    # Default value: tight
    id: none

    # Whether to use the identification scale factors
    # Default value: yes
    use id scale factors: no

    # Whether to use the reconstruction scale factors
    # Default value: yes
    use reconstruction scale factors: yes

    # Whether to use the Rochester electron energy correction (instead of POG correction)
    use rochester electron energy correction: yes
    rochester energy correction path: EleEnergyCorr/e_16aUL_1.txt

    # Charge misidentification efficiency correction for electrons
    use charge misid sf: no
    charge misid sf location: ChargeMisid/CFRate2016a.root
    # Choose mode: 0 -- nominal correction values, 1 -- up variation by 1 sigma, -1 -- down variation
    charge misid sf mode: 0

# Options related to the selection of muons
muons:
    # Pt cut [GeV]
    # Default value: 20
    pt: 26

    # Eta cut
    # Default value: 2.4
    eta: 2.4

    # Relative isolation cut
    # Default value: 0.25
    #isolation: 0.15

    #Iso
    # Possible values: veryloose, loose, medium, tight
    iso: none

    # Id
    # Possible values: loose, medium, tight
    # Default value: tight
    id: tight

    # Whether to use the identification scale factors
    # Default value: yes
    use id scale factors: yes

    # Whether to use the isolation scale factors
    # Default value: yes
    use isolation scale factors: no

    # Whether to use the tracking scale factors
    # Default value: yes
    use tracking scale factors: no

    # Whether to use Rochester correction
    # Default value: yes
    use rochester correction: yes

    # Path to the directory containing tables for Rochester corrections. Interpreted relative to
    # the EfficiencyTables/ directory.
    # Default value: rcdata.2016.v3
    rochester correction path: 2016preAPV/RoccoR2016aUL.txt

# Good Z boson settings
Z:
    # leading "lepton" pT cut [GeV]
    # Default value: 25
    leading lepton pt: 26

    #mass/elpt(II)
    mll/subleading lepton pT: 10
    invert cut: no
    
    # Low mass bound [GeV]
    # Default value: 0
    low mass: 40

    # High mass bound [GeV]
    # Default value: infinity
    high mass: 3000

    # Charge check mode
    # Possible values:
    #   - none: No check
    #   - neutral: Keep only lepton pairs of opposite sign
    #   - same sign: Keep only lepton pairs of the same sign
    # Default value: neutral
    charge mode: neutral

    # Flavor check mode
    # Possible values:
    #   - none: No check
    #   - same: Two leptons of the same flavor
    #   - ee: Two electrons
    #   - mumu: Two muons
    #   - emu: One electron and one muon
    # Default value: same
    flavor mode: emu

    # Choose a sideband (for fake background study)
    # Possible values:
    #   - 0: Regular event selection (signal region)
    #   - 1: One electron (muon) must fail Medium ID (tight iso) cut
    #   - 2: Both electrons (muons) must fail their Medium ID (tight iso) cuts
    # Default value: 0
    # DOUBLE CHECK! Electron ID (muon iso) must be set to "none" in the XML file for this to work!
    invert lepton cuts: 2

# How the measurement is binned in mass
# Default value: empty
mass bins: [ 40, 50, 76, 106, 170, 350, 1000, 3000 ]

# Triggers
#
# The values below must be strings; use an empty string to disable triggers. See the documentation
# of physics::trigger_mask for more details.
triggers: |
     HLT_IsoTkMu24,
     HLT_IsoMu24

use trigger scale factors: yes

# List of available data/MC samples
samples:
    ### DATA
    - name: data
      type: data
      jobs: 16
      nano dir: Catalogs/2016preAPV
      catalog: Catalog2016_bonzai_SingleMuon_data.txt
    ### BACKGROUND
    - name: ST_s-channel
      type: background
      nano dir: Catalogs/2016preAPV/
      catalog: Catalog2016_bonzai_ST_s-channel.txt
    - name: ST_t-channel_antitop
      type: background
      nano dir: Catalogs/2016preAPV/
      catalog: Catalog2016_bonzai_ST_t-channel_antitop.txt
    - name: ST_t-channel_top
      type: background
      jobs: 3
      nano dir: Catalogs/2016preAPV/
      catalog: Catalog2016_bonzai_ST_t-channel_top.txt
    - name: ST_tW_antitop
      type: background
      nano dir: Catalogs/2016preAPV/
      catalog: Catalog2016_bonzai_ST_tW_antitop.txt
    - name: ST_tW_top
      type: background
      nano dir: Catalogs/2016preAPV/
      catalog: Catalog2016_bonzai_ST_tW_top.txt
    - name: WJetsToLNu
      type: background
      jobs: 4
      nano dir: Catalogs/2016preAPV/
      catalog: Catalog2016_bonzai_WJetsToLNu.txt
    - name: WWTo2L2Nu
      type: background
      nano dir: Catalogs/2016preAPV
      catalog: Catalog2016_bonzai_WWTo2L2Nu.txt
    - name: WZ
      type: background
      nano dir: Catalogs/2016preAPV
      catalog: Catalog2016_bonzai_WZ.txt
    - name: ZZ
      type: background
      jobs: 5
      nano dir: Catalogs/2016preAPV
      catalog: Catalog2016_bonzai_ZZ.txt
    - name: TT
      type: background
      jobs: 10
      nano dir: Catalogs/2016preAPV
      catalog: Catalog2016_bonzai_TTTo2L2Nu.txt
    - name: TauTau
      type: background
      jobs: 3
      nano dir: Catalogs/2016preAPV
      catalog: Catalog2016_bonzai_TauTau.txt
    - name: GammaGamma
      type: background
      nano dir: Catalogs/2016preAPV
      catalog: Catalog2016_bonzai_GGToLL.txt
    - name: GammaGamma_M-5to50
      type: background
      nano dir: Catalogs/2016preAPV
      catalog: Catalog2016_bonzai_GGToLL_M-5to50.txt
    - name: WJetsToLNu
      type: background
      jobs: 4
      nano dir: Catalogs/2016preAPV/
      catalog: Catalog2016_bonzai_WJetsToLNu.txt

# Scale factors
tables:
    muon id:        2016preAPV/Efficiencies_muon_generalTracks_Z_Run2016_UL_HIPM_ID_TightID.txt
    muon isolation: 2016preAPV/Efficiencies_muon_generalTracks_Z_Run2016_UL_HIPM_ISO_NUM_TightRelIso_DEN_TightIDandIPCut.txt
    electron id:    2016preAPVee/egamma_Medium.txt
    electron reco:  2016preAPVee/egamma_reco_all_SF.txt
    smu trigger data: 2016preAPV/Efficiencies_muon_generalTracks_Z_Run2016_UL_HIPM_SingleMuonTriggers_Data.txt
    smu trigger mc: 2016preAPV/Efficiencies_muon_generalTracks_Z_Run2016_UL_HIPM_SingleMuonTriggers_MC.txt

# Reweighing (eg for merged samples)
#
# For each possible reweighing, the syntax is:
#
#   sample name: table.txt
#
# The table should contain the numbers needed for reweighing. In order to be
# useful, several samples will often share the same table.
#
# The tables can be derived by tweaking Main/dyjets-sample-weights.cc.
#reweighing:
#    # Based on the number of partons npNLO
#    npNLO:
#        DYJets:     merging-DYJets-npNLO.txt
#        DYJets-0J:  merging-DYJets-npNLO.txt
#        DYJets-1J:  merging-DYJets-npNLO.txt
#        DYJets-2J:  merging-DYJets-npNLO.txt

# How to group MC samples when drawing Data/MC comparisons
MC grouping:
    - legend: "t#bar{t}"
      samples: [ TT ]
      color: 600 # kBlue
    - legend: "DY#rightarrow#tau#tau"
      samples: [ TauTau ]
      color: 434 # kCyan + 2
    - legend: VV
      samples: [ ZZ, WWTo2L2Nu, WZ ]
      color: 633 # kRed + 1
    - legend: Single top
      samples: [ ST_s-channel, ST_t-channel_antitop, ST_t-channel_top, ST_tW_antitop, ST_tW_top ]
      color: 616 # kMagenta
    - legend: "#gamma#gamma"
      samples: [ GammaGamma, GammaGamma_M-5to50 ]
      color: 800 # kOrange

# The file below defines the binnings for histograms relevant to the analysis.
# Default value: dyjets-binnings.yml
binning file: dyjets-binnings.yml

# Plot properties
#
# The sole mandatory field is the "selector", containing a regex that is matched
# against plot names. When a plot name matches the regex, properties listed in
# other fields are assigned to it. In general, rules lower in the list take
# precedence over the ones above them, but for some properties they add up.
#
# Supported properties:
#   - produce (yes): Whether to make the plot
#   - log x (no): Whether to x axis should use a log scale
#   - ratio min (0.601): The minimum value shown on data/mc ratio plots
#   - ratio max (1.399): The maximum value shown on data/mc ratio plots
#   - x axis label: The label of the x axis. Captures from the selector can be
#                   used to provide dynamic labels.
#   - x axis detail: Text that will appear in parenthesis after the axis label.
#                    Several labels can be added this way. Captures from the
#                    selector can be used to provide dynamic labels.
#   - x axis unit: The unit of the x axis. Appears between square brackets after
#                  the main label. Captures from the selector can be used to
#                  provide dynamic labels.
plots:
    # Excluded plots
    - selector: '.*'
      produce: no
    - selector: 'el.*inc0jet'
      produce: yes
    - selector: 'mu.*inc0jet'
      produce: yes
    - selector: '.*leading.*'
      produce: no
    - selector: '.*exc.*'
      produce: no
    - selector: 'mass_wide_range_inc0jet'
      produce: yes
    - selector: 'pt_inc0jet'
      produce: yes
    - selector: 'pt_inc0jet_mass40_3000'
      produce: yes
    - selector: 'rapidity_inc0jet'
      produce: yes
    - selector: 'rapidity_inc0jet_mass40_3000'
      produce: yes
    - selector: 'phistar_inc0jet'
      produce: yes
    - selector: 'MET_pt_inc0jet'
      produce: yes
    - selector: 'MET_pt_inc0jet_mass40_3000'
      produce: yes
    - selector: 'MET_vs_mass_inc0jet'
      produce: yes
    - selector: 'MET_vs_mass_inc0jet_mass40_3000'
      produce: yes
    - selector: 'mll_over_ptsub_inc0jet'
      produce: yes
    # Style changes
    - selector: '.*'
#      ratio min: 0.601
#      ratio max: 1.399
      ratio min: 0.501
      ratio max: 2.499
    - selector: '^phistar.*'
      log x: yes
    - selector: '^pt.*'
      log x: yes
    - selector: '^pt_cut.*'
      log x: yes
    - selector: '^mass_wide.*'
      log x: yes
    - selector: 'mass_inc0jet'
      ratio min: 0.501
      ratio max: 2.499
    # Axis labels
    - selector: '^mass.*'
      x axis label: 'M_{e#mu}'
      x axis unit: 'GeV'
    - selector: '^nJets.*'
      x axis label: 'Exclusive number of jets'
    - selector: '^nJetsIncl.*'
      x axis label: 'Inclusive number of jets'
    - selector: '^phistar.*'
      x axis label: '#phi*'
    - selector: '^pt.*'
      x axis label: 'p_{T}^{e#mu}'
      x axis unit: 'GeV'
    - selector: '.+mass(.*)_(.*).*'
      x axis detail: '$1 #leq M_{e#mu} < $2 GeV'
    - selector: '.*inc(1|2)jet.*'
      x axis detail: 'N_{jets} #geq $1'
    - selector: '.*exc(1|2)jet.*'
      x axis detail: 'N_{jets} = $1'
    - selector: '^mass_cut.*'
      x axis label: 'M_{e#mu}'
      x axis unit: 'GeV'
    - selector: '^pt_cut.*'
      x axis label: 'p_{T}^{e#mu}'
      x axis unit: 'GeV'
