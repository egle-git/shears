# Binning file for the dyjets analyzer
#
# This file defines the binnings of histograms when the dyjets analyzer is used.
#
# The sole mandatory field is the "selector", containing a regex that is matched
# against plot names. When a plot name matches the regex, properties listed in
# other fields are assigned to it. Rules lower in the list take precedence over
# the ones above them.
#
# The 'binning' field defines the method used to select a binning. It can take
# the following values:
#
#   ignored (default): The contents of this file is ignored and the binning is
#                      taken from a declare() statement (an error is thrown if
#                      the histogram wasn't declared).
#
#   uniform: The binning is uniform between 'binning min' and 'binning max',
#            with 100 or 'bin count' bins.
#
#   custom: Bin edges are taken form the 'bin edges' array.
#

################################################################################
# Mass
################################################################################

# On-shell
# reco mass
- selector: 'mass.*'
  binning: uniform
  binning min: 71
  binning max: 111
  bin count: 240
# gen mass
- selector: 'mass.*-gen'
  binning: uniform
  binning min: 71
  binning max: 111
  bin count: 240

# Wide range
# reco mass
- selector: 'mass_wide_range.*'
  binning: custom
  bin edges: [50,52.5,55,57.5,60,62,64,66,68,70,72,74,76,78.5,81,83.5,86,88.5,91,93.5,96,98.5,101,103.5,106,108,110,112.5,115,117.5,120,123,126,129.5,133,137,141,145.5,150,155,160,165.5,171,178,185,192.5,200,210,220,231.5,243,258,273,296.5,320,350,380,410,440,475,510,555,600,650,700,765,830,915,1000,1250,1500,1750,2000,2500,3000]

# gen mass 5 GeV bins
- selector: 'LHE_5GeV.*'
  binning: uniform
  binning min: 0
  binning max: 3000
  bin count: 600

# gen mass 1 Gev bins
- selector: 'LHE_1GeV.*'
  binning: uniform
  binning min: 0
  binning max: 3000
  bin count: 3000

# gen mass 10 Gev bins
- selector: 'LHE_10GeV.*'
  binning: uniform
  binning min: 100
  binning max: 3000
  bin count: 290

# gen mass 100 Gev bins
- selector: 'LHE_100GeV.*'
  binning: uniform
  binning min: 100
  binning max: 3000
  bin count: 29

# gen mass 1 Gev bins with Z at LHE mass
#- selector: 'zzmas_1GeV.*'
#  binning: uniform
#  binning min: 0
#  binning max: 3000
#  bin count: 3000

# gen mass
- selector: 'mass_wide_range.*-gen'
  binning: custom
  bin edges: [50,55,60,64,68,72,76,81,86,91,96,101,106,110,115,120,126,133,141,150,160,171,185,200,220,243,273,320,380,440,510,600,700,830,1000,1500,2000,3000]

# migration matrix
# This needs to be fixed so that binX edges and binY edges automatically come from
# the reco and gen 1D distribution binning
# For now, make sure the binnings for the matrices matches the corresponding distributions
- selector: '(.*)-matrix'
  binning: custom
  # reco binning
  binX edges: [50,52.5,55,57.5,60,62,64,66,68,70,72,74,76,78.5,81,83.5,86,88.5,91,93.5,96,98.5,101,103.5,106,108,110,112.5,115,117.5,120,123,126,129.5,133,137,141,145.5,150,155,160,165.5,171,178,185,192.5,200,210,220,231.5,243,258,273,296.5,320,350,380,410,440,475,510,555,600,650,700,765,830,915,1000,1250,1500,1750,2000,2500,3000]
  # gen binning
  binY edges: [50,55,60,64,68,72,76,81,86,91,96,101,106,110,115,120,126,133,141,150,160,171,185,200,220,243,273,320,380,440,510,600,700,830,1000,1500,2000,3000]

################################################################################
# p_T
################################################################################

# Default binning, 0 jet
- selector: 'pt_(inc|exc)0jet.*'
  binning: custom
  bin edges: [
    0, 2, 4, 6, 8, 10, 12, 14, 18, 22, 28, 37, 52, 85, 160, 240, 1000 ]
  # matrix
- selector: 'pt_(inc|exc)0jet.*-matrix'
  binning: custom
  binX edges: [
    0, 2, 4, 6, 8, 10, 12, 14, 18, 22, 28, 37, 52, 85, 160, 240, 1000 ]
  binY edges: [
    0, 2, 4, 6, 8, 10, 12, 14, 18, 22, 28, 37, 52, 85, 160, 240, 1000 ]

# Default binning, 1 and 2 jets
- selector: 'pt_(inc|exc)[12]jet.*'
  binning: custom
  bin edges: [ 0, 4, 8, 12, 18, 22, 28, 37, 52, 85, 160, 240, 1000 ]
  # matrix
- selector: 'pt_(inc|exc)[12]jet.*-matrix'
  binning: custom
  binX edges: [ 0, 4, 8, 12, 18, 22, 28, 37, 52, 85, 160, 240, 1000 ]
  binY edges: [ 0, 4, 8, 12, 18, 22, 28, 37, 52, 85, 160, 240, 1000 ]

